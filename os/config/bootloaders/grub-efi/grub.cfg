set default=0
set timeout=8
set color_normal=white/black
set color_highlight=black/light-cyan

echo "AstraOS 0.1 | Live System"
echo ""

search --no-floppy --label ASTRAOS_0_1 --set=root

menuentry "Start AstraOS 0.1" {
    linux /live/vmlinuz boot=live components quiet splash username=astra hostname=astraos
    initrd /live/initrd.img
}
