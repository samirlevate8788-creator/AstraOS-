services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: astraos_feedback
      POSTGRES_USER: astraos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a strong password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - astraos_feedback_data:/var/lib/postgresql/data
      - ./database/init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astraos -d astraos_feedback"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  astraos_feedback_data:
